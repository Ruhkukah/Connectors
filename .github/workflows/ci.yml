name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # This explicitly read-only draft must not execute even fake publisher calls.
  # Other PRs, main and manual runs retain the full suites.
  C2_PREFLIGHT_ONLY: >-
    ${{ github.event_name == 'pull_request' &&
    (github.head_ref == 'codex/plaza2-c2-preflight-20260907' || github.head_ref == 'codex/plaza2-c2-capture-20260907') }}

jobs:
  connector-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt

      - name: Guard hidden Unicode
        run: |
          python3 tools/unicode_guard.py \
            .github \
            CMakeLists.txt \
            cmake \
            include \
            src \
            protocols \
            connectors \
            tools \
            tests \
            matrix \
            profiles \
            cert \
            docs \
            scripts \
            apps

      - name: Guard hidden Unicode in PR diff
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}...HEAD" > /tmp/moex_pr.diff
          python3 tools/unicode_guard.py /tmp/moex_pr.diff

      - name: Repository style check
        run: python3 tools/repo_style_check.py

      - name: Source/style check
        run: |
          python3 tools/source_style_check.py --require-clang-format \
            .github \
            CMakeLists.txt \
            cmake \
            include \
            src \
            protocols \
            connectors \
            tools \
            tests \
            matrix \
            profiles \
            cert \
            docs \
            scripts \
            apps

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          if [ "$C2_PREFLIGHT_ONLY" = "true" ]; then
            cmake --build build --parallel 2 --target \
              plaza2_c2_preflight_test plaza2_public_wire_test plaza2_ordlog_test plaza2_ordlog_benchmark plaza2_c2_capture
          else
            cmake --build build
          fi

      - name: Run ctest
        run: |
          if [ "$C2_PREFLIGHT_ONLY" = "true" ]; then
            ctest --test-dir build --output-on-failure -L c2_preflight
          else
            ctest --test-dir build --output-on-failure -LE preflight
          fi

      - name: Complete Release preflight coverage for recovery review
        if: github.head_ref == 'codex/plaza2-process-recovery' || github.head_ref == 'codex/plaza2-open-recovery'
        run: ctest --test-dir build --output-on-failure -L preflight

      - name: Upload listener-only capture preparation binaries
        if: github.head_ref == 'codex/plaza2-c2-capture-20260907'
        uses: actions/upload-artifact@v4
        with:
          name: plaza2-c2-capture-linux-amd64
          path: |
            build/apps/plaza2_c2_capture
            build/tests/plaza2_c2_preflight_test
            tools/plaza2_c2_capture_import.py

  component-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Configure sanitizer build
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build-asan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build sanitizer targets
        run: |
          if [ "$C2_PREFLIGHT_ONLY" = "true" ]; then
            cmake --build build-asan --parallel 2 --target \
              plaza2_c2_preflight_test plaza2_public_wire_test plaza2_ordlog_test plaza2_ordlog_benchmark plaza2_c2_capture
          else
            cmake --build build-asan --parallel 2
          fi

      - name: Run critical component sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          if [ "$C2_PREFLIGHT_ONLY" = "true" ]; then
            ctest --test-dir build-asan --output-on-failure -L c2_preflight
          else
            ctest --test-dir build-asan --output-on-failure -L "sanitizer|plaza2"
          fi

  september11-pr55-package:
    if: github.head_ref == 'codex/plaza2-sep11-pr55-observation'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Build exact native Release package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2 --target plaza2_aggr_qualification_20260911_pr55
          mkdir package
          cp build/apps/plaza2_aggr_qualification_20260911_pr55 package/
          cp scripts/vps/plaza2_aggr_qualification*.py package/
          git rev-parse HEAD > package/source-sha.txt
          test "$(package/plaza2_aggr_qualification_20260911_pr55 --version)" = "$(cat package/source-sha.txt)"
          package/plaza2_aggr_qualification_20260911_pr55 --self-test > package/self-test.txt
          binary=package/plaza2_aggr_qualification_20260911_pr55
          if env MOEX_AGGR_T1_AUTH=wrong "$binary" /tmp/wrong-token 1; then exit 1; fi
          if env MOEX_AGGR_T1_AUTH=20260911_PR55_AGGREGATED_OBSERVATION MOEX_AGGR_T1_ORDER_AUTH= "$binary" /tmp/order-auth 1; then exit 1; fi
          test ! -e /tmp/wrong-token
          test ! -e /tmp/order-auth
          c++ --version > package/compiler.txt
          uname -sm > package/architecture.txt
          cp build/CMakeCache.txt package/
          objdump -T package/plaza2_aggr_qualification_20260911_pr55 > package/symbols.txt
          sha256sum package/plaza2_aggr_qualification_20260911_pr55 > package/binary-sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: plaza2-sep11-pr55-linux-x86-64
          path: package/
