name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  connector-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install clang-format 18.1.8
        run: python -m pip install clang-format==18.1.8
      - name: Check C++ formatting
        shell: bash
        run: |
          clang-format --version
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="HEAD^"
          fi
          while IFS= read -r -d '' source; do
            [ -f "$source" ] || continue
            case "$source" in
              */generated/*|*/fixtures/*) continue ;;
            esac
            clang-format --dry-run --Werror "$source"
          done < <(git diff --name-only --diff-filter=ACMR -z "$base" HEAD -- '*.cpp' '*.hpp')
      - name: Install Zstd development files
        run: sudo apt-get update && sudo apt-get install -y libzstd-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Rehearsal safeguard tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s scripts/test_rehearsal -p 'test_*.py'

  component-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang libzstd-dev
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
      - name: Build
        run: cmake --build build-asan --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure
      - name: Rehearsal safeguard tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s scripts/test_rehearsal -p 'test_*.py'

  dtc-thread-sanitizer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Clang and ThreadSanitizer
        run: sudo apt-get update && sudo apt-get install -y clang libclang-rt-dev libzstd-dev
      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: >-
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=thread -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=thread"
      - name: Build
        run: >-
          cmake --build build-tsan --parallel 2 --target
          connector_host_dtc_server_test event_journal_test order_manager_test
          full_order_log_trading_runner_test full_order_log_dtc_channel_test
          full_order_log_dtc_identity_test
      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=66
        run: |
          # LLVM 18 TSan needs a compatible shadow-memory layout on Ubuntu 24.04.
          previous=$(sysctl -n vm.mmap_rnd_bits)
          if [ "$previous" -gt 28 ]; then
            sudo sysctl -w vm.mmap_rnd_bits=28
            trap 'sudo sysctl -w "vm.mmap_rnd_bits=$previous"' EXIT
          fi
          ctest --test-dir build-tsan --output-on-failure --no-tests=error \
            -R '^(connector_host_dtc_server_test|event_journal_test|order_manager_test|full_order_log_writer_dtc_worker_test|full_order_log_dtc_channel_test|full_order_log_dtc_identity_test)$'
