name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  connector-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Install Python requirements
        run: python -m pip install -r requirements.txt

      - name: Guard hidden Unicode
        run: |
          python3 tools/unicode_guard.py \
            .github \
            CMakeLists.txt \
            cmake \
            include \
            src \
            protocols \
            connectors \
            tools \
            tests \
            matrix \
            profiles \
            cert \
            docs \
            scripts \
            apps

      - name: Guard hidden Unicode in PR diff
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          git diff "origin/${{ github.base_ref }}...HEAD" > /tmp/moex_pr.diff
          python3 tools/unicode_guard.py /tmp/moex_pr.diff

      - name: Repository style check
        run: python3 tools/repo_style_check.py

      - name: Source/style check
        run: |
          python3 tools/source_style_check.py --require-clang-format \
            .github \
            CMakeLists.txt \
            cmake \
            include \
            src \
            protocols \
            connectors \
            tools \
            tests \
            matrix \
            profiles \
            cert \
            docs \
            scripts \
            apps

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build

      - name: Run ctest
        run: ctest --test-dir build --output-on-failure -LE preflight

  component-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Configure sanitizer build
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build-asan
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build sanitizer targets
        run: >
          cmake --build build-asan --target
          twime_sbe_tests
          twime_session_tests
          twime_byte_transport_tests
          twime_tcp_transport_tests
          twime_tcp_session_tests
          twime_endpoint_gate_tests
          twime_live_runner_tests
          moex_phase0_selfcheck
          plaza2_order_lifecycle_scenarios_test
          plaza2_runtime_adapter_test
          plaza2_runtime_probe_test
          plaza2_trade_no_send_guard_test
          plaza2_trade_transport_scenarios_test

      - name: Run critical component sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-asan --output-on-failure -L sanitizer
